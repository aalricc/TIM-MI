[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mi-agent"
version = "0.2.0"
description = "Diagnostics-first autonomous recovery agent for SQLite services"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "jsonschema>=4.23,<5",
]
rag = [
  "pinecone>=6,<7",
  "pypdf>=5,<6",
]
jev = [
  "langchain-typesafe>=0.0.1a3,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mi_agent"]

[tool.pytest.ini_options]
addopts = "-q -m 'not live'"
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "live: requires real OpenAI connectivity and credentials",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["mi_agent"]
warn_unused_configs = true
