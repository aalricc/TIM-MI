[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mi-agent"
version = "0.2.0"
description = "Diagnostics-first autonomous recovery agent for SQLite services"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.15,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "jsonschema>=4.23,<5",
  "pre-commit>=3.7,<5",
  "pip-audit>=2.7,<3",
]
rag = [
  "pinecone>=6,<7",
  "pypdf>=6.21.1,<7",
]
jev = [
  # Third-party alpha client used to reach the self-hosted open-source JEV server.
  # Pinned exactly: upgrade deliberately after tests/test_jev_client.py passes.
  "langchain-typesafe==0.0.1a3",
]
# Optional LangSmith tracing of the WHY / HOW LLM calls (src/mi_agent/llm/tracing.py).
trace = [
  "langsmith>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mi_agent"]

[tool.pytest.ini_options]
addopts = "-q -m 'not live'"
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "live: requires real OpenAI connectivity and credentials",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare asserts.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["mi_agent"]
warn_unused_configs = true

[[tool.mypy.overrides]]
# Optional `trace` extra: tracing is a no-op when it is not installed.
module = ["langsmith", "langsmith.*"]
ignore_missing_imports = true
