name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy --strict src

      - name: Mypy (harness)
        run: mypy --strict harness

      - name: Pytest
        run: pytest -q

  audit:
    # Dependency vulnerability scan over everything the runtime image ships (jev, rag)
    # plus dev tooling. Fix by raising the affected pin in pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install image and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,jev,rag]"

      - name: pip-audit
        run: pip-audit --skip-editable --progress-spinner off
