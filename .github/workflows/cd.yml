name: CD

# Runs only for commits on main, which got there through the PR gates
# (lint-type-test, dependency-audit, docker-build-smoke, agent-review, risk-gate).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  images:
    name: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build and push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for spec in "mi-agent:Dockerfile" "mi-target:target/app/Dockerfile"; do
            name=${spec%%:*}; file=${spec#*:}
            image="ghcr.io/$owner/$name"
            docker build -t "$image:${GITHUB_SHA}" -t "$image:latest" -f "$file" .
            docker push "$image:${GITHUB_SHA}"
            docker push "$image:latest"
          done

  site:
    name: deploy-site
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Deploy site/ to Vercel production
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel secrets not configured; skipping site deploy"
            exit 0
          fi
          cd site
          npx --yes vercel@65.17.0 deploy --prod --yes --token "$VERCEL_TOKEN"
