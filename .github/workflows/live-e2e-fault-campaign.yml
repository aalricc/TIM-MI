name: Live E2E Fault Campaign

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-e2e-fault-campaign
  cancel-in-progress: false

jobs:
  campaign:
    # D2=(c): manual workflow_dispatch only, on a host that can reach local JEV.
    runs-on: self-hosted
    # 15 runs (3 faults x 5); worst case ~8.5 min each.
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MI_LLM_ENDPOINT: ${{ vars.MI_LLM_ENDPOINT }}
      MI_LLM_AUTH_MODE: ${{ vars.MI_LLM_AUTH_MODE }}
      # Registers the target's fault-injection and reset endpoints for the campaign.
      TARGET_TEST_HOOKS: "1"
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,jev,rag]"

      - name: Start with empty MI state
        # Memory is kept across the runs of one campaign, never across campaigns.
        run: find state -mindepth 1 ! -name .gitkeep -delete

      - name: Start stack
        run: docker compose up -d --build --remove-orphans

      - name: Wait for target and agent live health
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health/live >/dev/null \
              && curl -fsS http://127.0.0.1:8090/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "target/agent health endpoints not ready in time" >&2
          exit 1

      - name: Run live LLM integration tests
        run: pytest -q -m live

      - name: Run fault campaign
        run: PYTHONPATH=. python scripts/e2e_fault_campaign.py --stage ci --repetitions 5

      - name: Capture compose logs
        if: always()
        run: |
          mkdir -p results
          docker compose logs --no-color > results/compose.log || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-fault-campaign-results
          path: |
            results/
            state/events.jsonl

      - name: Tear down stack
        if: always()
        # -v drops the backups volume so the next campaign starts without old backups.
        run: docker compose down -v --remove-orphans
