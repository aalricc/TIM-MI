name: Selective LLM Review

on:
  pull_request:
    paths:
      - src/mi_agent/agent/engine.py
      - src/mi_agent/tools/executor.py
      - src/mi_agent/tools/schemas.py
      - src/mi_agent/tools/pathing.py
      - src/mi_agent/decision/**
      - src/mi_agent/llm/**
      - src/mi_agent/workflow/models.py
      - src/mi_agent/config.py
      - src/mi_agent/class_memory.py
      - harness/contracts/*.schema.v*.json
      - harness/sensors/**/*.py
      - harness/metrics/thresholds.json
      - harness/guides/judge_rubric.md
      - state/skills.md
      - state/class_store.json
      - state/policy_store.json
      - state/tool_catalog.json

permissions:
  contents: read
  pull-requests: write

jobs:
  advisory-review:
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Collect changed files
        run: |
          mkdir -p results/harness
          git fetch origin "${GITHUB_BASE_REF}" --depth=1
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > results/harness/changed-files.txt

      - name: Generate advisory LLM review
        continue-on-error: true
        run: |
          python -m harness.review.pr_review \
            pr \
            --files-file results/harness/changed-files.txt \
            > results/harness/pr-llm-review.md

      - name: Ensure review output exists
        if: always()
        run: |
          if [ ! -s results/harness/pr-llm-review.md ]; then
            cat > results/harness/pr-llm-review.md <<'EOF'
          ## Advisory LLM Review

          Review output was unavailable for this run. Keeping review non-blocking.
          EOF
          fi

      - name: Post advisory PR comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- selective-llm-review -->';
            const body = `${marker}\n${fs.readFileSync('results/harness/pr-llm-review.md', 'utf8')}`;
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Write job summary
        if: always()
        run: cat results/harness/pr-llm-review.md >> "$GITHUB_STEP_SUMMARY"

