name: Dependency drift

# Continuous stage (harness/governance/README.md): re-resolve dependencies from the
# pyproject.toml ranges without a cache, so newly published advisories and releases
# surface even when no code changes. Opens (or comments on) one tracking issue on failure.
on:
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image and dev dependencies (fresh resolution)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e ".[dev,jev,rag,trace]"

      - name: pip-audit
        run: pip-audit --skip-editable --progress-spinner off --desc on -f markdown -o audit.md

      - name: Ruff security rules
        if: success() || failure()
        run: ruff check . --select S

      - name: Open or update tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Dependency drift: weekly security scan failed"
          {
            echo "Weekly drift scan failed: $RUN_URL"
            echo
            if [ -s audit.md ]; then
              echo "## pip-audit"
              echo
              head -c 60000 audit.md
            else
              echo "pip-audit reported no vulnerabilities; see the run log (ruff security rules or install step)."
            fi
          } > issue.md
          number="$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file issue.md
          else
            gh issue create --repo "$REPO" --title "$title" --body-file issue.md
          fi
