<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MI Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #171a21;
        --text: #e8ebf2;
        --muted: #9aa3b2;
        --ok: #52d273;
        --warn: #ffd166;
        --bad: #ff6b6b;
        --line: #2a2f3a;
        --tab: #1d2330;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
        color: var(--text);
        background: var(--bg);
      }
      header {
        position: sticky;
        top: 0;
        background: #11141b;
        border-bottom: 1px solid var(--line);
        padding: 12px 16px;
        z-index: 2;
      }
      header h1 { margin: 0; font-size: 18px; }
      header p { margin: 4px 0 0; color: var(--muted); }
      .tabs {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .tab {
        border: 1px solid var(--line);
        background: var(--tab);
        color: var(--muted);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .tab.active {
        color: var(--text);
        border-color: #3d6ad6;
      }
      .view {
        display: none;
        padding: 12px;
      }
      .view.active {
        display: grid;
      }
      #live-view {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      #history-view {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .live-full {
        grid-column: 1 / -1;
      }
      .history-full {
        grid-column: 1 / -1;
      }
      @media (max-width: 1400px) {
        #live-view {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 900px) {
        #live-view,
        #history-view {
          grid-template-columns: 1fr;
        }
        .live-full,
        .history-full {
          grid-column: 1;
        }
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        min-height: 120px;
      }
      h2 { margin: 0 0 8px; font-size: 14px; color: #dce3f2; }
      .pill {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 8px;
        margin-right: 6px;
        margin-bottom: 4px;
        color: var(--muted);
      }
      .ok { color: var(--ok); }
      .warn { color: var(--warn); }
      .bad { color: var(--bad); }
      table { width: 100%; border-collapse: collapse; }
      th, td {
        text-align: left;
        border-bottom: 1px solid var(--line);
        padding: 6px 4px;
        vertical-align: top;
      }
      th { color: var(--muted); font-weight: 600; }
      ul { margin: 0; padding-left: 18px; }
      li { margin: 4px 0; }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 320px;
        overflow: auto;
      }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .small { font-size: 12px; color: var(--muted); }
      details > summary { cursor: pointer; color: #d7def0; }
      .badge {
        font-size: 11px;
        border: 1px solid #3d6ad6;
        color: #8fb0ff;
        border-radius: 999px;
        padding: 1px 8px;
        margin-left: 6px;
      }
      .trace-button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        border-radius: 6px;
        cursor: pointer;
        padding: 4px 8px;
      }
      .trace-button.selected {
        border-color: #3d6ad6;
        color: #8fb0ff;
      }
      .card-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 260px;
        overflow-y: auto;
      }
      .info-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #11141b;
        padding: 8px;
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 4px;
      }
      .incident-badge {
        font-size: 11px;
        border: 1px solid #3d6ad6;
        color: #8fb0ff;
        border-radius: 999px;
        padding: 1px 8px;
      }
      .incident-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .incident-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #11141b;
        padding: 10px;
      }
      .incident-panel h3 {
        margin: 0 0 8px;
        font-size: 13px;
        color: #dce3f2;
      }
      .incident-panel.full {
        grid-column: 1 / -1;
      }
      @media (max-width: 1200px) {
        .incident-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 900px) {
        .incident-grid {
          grid-template-columns: 1fr;
        }
        .incident-panel.full {
          grid-column: 1;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>MI Dashboard</h1>
      <p id="meta" class="small">Loading…</p>
      <div class="tabs">
        <button id="tab-live" class="tab active" type="button">Live</button>
        <button id="tab-history" class="tab" type="button">History</button>
      </div>
    </header>

    <main id="live-view" class="view active">
      <section>
        <h2>Agent State</h2>
        <div id="agent-state"></div>
      </section>

      <section>
        <h2>WHY Diagnosis</h2>
        <div id="why"></div>
      </section>

      <section>
        <h2>HOW Proposals</h2>
        <div id="how"></div>
      </section>

      <section>
        <h2>Recovery Timeline</h2>
        <div id="timeline"></div>
      </section>

      <section>
        <h2>RL Live</h2>
        <div id="rl"></div>
      </section>

      <section>
        <h2>Dynamic Tool Catalog</h2>
        <div id="catalog"></div>
      </section>

      <section class="live-full">
        <h2>Raw LLM Trace</h2>
        <div id="raw-trace"></div>
      </section>
    </main>

    <main id="history-view" class="view">
      <section class="history-full">
        <h2>Recovery History</h2>
        <div id="history"></div>
      </section>
      <section class="history-full">
        <h2>Incident View</h2>
        <div id="history-incident"></div>
      </section>
      <section class="history-full">
        <h2>Raw LLM Trace</h2>
        <div id="history-trace"></div>
      </section>
    </main>

    <script>
      const byId = (id) => document.getElementById(id);
      let activeTab = 'live';
      let selectedHistoryIncident = null;
      let latestDashboard = null;
      let inFlight = false;

      function esc(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;');
      }

      function asJson(value) {
        return `<pre class="mono">${esc(JSON.stringify(value, null, 2))}</pre>`;
      }

      function setActiveTab(tab) {
        activeTab = tab;
        byId('tab-live').classList.toggle('active', tab === 'live');
        byId('tab-history').classList.toggle('active', tab === 'history');
        byId('live-view').classList.toggle('active', tab === 'live');
        byId('history-view').classList.toggle('active', tab === 'history');
      }

      function stateMarkup(state) {
        const incident = state && state.active_incident ? state.active_incident : null;
        const lastMonitor = state && state.last_monitor ? state.last_monitor : {};
        const cls = state.workflow_state === 'healthy'
          ? 'ok'
          : (state.workflow_state === 'incident_active' ? 'bad' : 'warn');
        return `
          <div class="pill ${cls}">workflow: ${esc(state.workflow_state || 'unknown')}</div>
          <div class="pill">monitor: ${esc(lastMonitor.detail || 'n/a')}</div>
          <div class="small">incident: ${esc(incident ? incident.incident_id : 'none')}</div>
          <div class="small">attempts: ${esc(incident ? incident.attempts : 0)}</div>
          <div class="small">last_error: ${esc(incident ? (incident.last_error || 'none') : 'none')}</div>
        `;
      }

      function renderAgentState(data) {
        const state = data.agent_state || {};
        byId('agent-state').innerHTML = stateMarkup(state);
      }

      function whyMarkup(why, emptyText) {
        if (!why) {
          return `<div class="small">${esc(emptyText)}</div>`;
        }
        return `
          <div><b>failure_type:</b> <span class="mono">${esc(why.failure_type || 'unknown')}</span></div>
          <div class="small"><b>hypotheses</b></div>
          <ul>${(why.hypotheses || []).map((item) => `<li>${esc(item)}</li>`).join('')}</ul>
          <div class="small"><b>evidence</b></div>
          <ul>${(why.evidence || []).map((item) => `<li>${esc(item)}</li>`).join('')}</ul>
        `;
      }

      function renderWhy(data) {
        byId('why').innerHTML = whyMarkup(data.latest_why, 'No active diagnosis.');
      }

      function howMarkup(how, emptyText) {
        if (!how) {
          return `<div class="small">${esc(emptyText)}</div>`;
        }
        const primary = how.primary || {};
        const alternatives = Array.isArray(how.alternatives) ? how.alternatives : [];
        return `
          <div>
            <b>Primary</b>
            <span class="badge">EXECUTED</span>
            <div class="small mono">${esc(primary.name || 'unnamed')} • ${esc(primary.operation || 'n/a')}</div>
            <div>${esc(primary.rationale || '')}</div>
          </div>
          <div class="small" style="margin-top:8px;"><b>Alternatives (observability only)</b></div>
          <ol>
            ${alternatives.map((item) => `
              <li>
                <div class="mono">${esc(item.name || 'unnamed')} • ${esc(item.operation || 'n/a')}</div>
                <div>${esc(item.rationale || '')}</div>
              </li>
            `).join('')}
          </ol>
        `;
      }

      function renderHow(data) {
        byId('how').innerHTML = howMarkup(data.latest_how, 'No active HOW proposal.');
      }

      function incidentViewFor(data, incidentId) {
        if (!incidentId) {
          return null;
        }
        const views = data && data.incident_views && typeof data.incident_views === 'object'
          ? data.incident_views
          : {};
        return views[incidentId] || null;
      }

      function incidentRlMarkup(incidentView, emptyText) {
        if (!incidentView) {
          return emptyText ? `<div class="small">${esc(emptyText)}</div>` : '';
        }
        const summary = incidentView.rl_summary || {};
        const rows = Array.isArray(summary.actions) ? summary.actions.slice(0, 6) : [];
        if (!rows.length) {
          return '<div class="small">No incident-scoped RL stats yet.</div>';
        }
        return `
          <div class="small">total_attempts: ${esc(summary.total_attempts || 0)} • reward_total: ${esc(summary.reward_total || 0)}</div>
          <div class="card-list">
            ${rows.map((row) => `
              <div class="info-card">
                <div class="card-header">
                  <span class="mono">${esc(row.action || 'unknown_action')}</span>
                  <span class="incident-badge">${esc(row.incident_id || incidentView.incident_id || 'unknown_incident')}</span>
                </div>
                <div class="small">attempts: ${esc(row.attempts || 0)}</div>
                <div class="small">reward_total: ${esc(row.reward_total || 0)}</div>
                <div class="small">avg_reward: ${esc(Number(row.avg_reward || 0).toFixed(3))}</div>
              </div>
            `).join('')}
          </div>
        `;
      }

      function renderIncidentRl(containerId, incidentView, emptyText) {
        byId(containerId).innerHTML = incidentRlMarkup(incidentView, emptyText);
      }

      function incidentCatalogMarkup(incidentView, emptyText) {
        if (!incidentView) {
          return emptyText ? `<div class="small">${esc(emptyText)}</div>` : '';
        }
        const rows = Array.isArray(incidentView.tool_catalog) ? incidentView.tool_catalog.slice(0, 6) : [];
        if (!rows.length) {
          return '<div class="small">No incident-scoped dynamic tools yet.</div>';
        }
        return `
          <div class="card-list">
            ${rows.map((row) => `
              <div class="info-card">
                <div class="card-header">
                  <span class="mono">${esc(row.tool_name || row.action || 'unknown_tool')}</span>
                  <span class="incident-badge">${esc(row.incident_id || incidentView.incident_id || 'unknown_incident')}</span>
                </div>
                <div class="small">action: <span class="mono">${esc(row.action || 'n/a')}</span></div>
                <div class="small">operation: ${esc(row.operation || 'n/a')}</div>
                <div class="small">attempts: ${esc(row.attempts || 0)}</div>
              </div>
            `).join('')}
          </div>
        `;
      }

      function renderIncidentCatalog(containerId, incidentView, emptyText) {
        byId(containerId).innerHTML = incidentCatalogMarkup(incidentView, emptyText);
      }

      function timelineMarkup(timeline, emptyText) {
        if (!timeline.length) {
          return `<div class="small">${esc(emptyText)}</div>`;
        }
        return `
          <ul>
            ${timeline.map((row) => {
              const ts = new Date((row.ts || 0) * 1000).toLocaleTimeString();
              const payload = row && typeof row.payload === 'object' && row.payload ? row.payload : {};
              if (row.event_type === 'workflow.step') {
                const parts = [];
                const attempt = payload.attempt;
                if (typeof attempt === 'number') {
                  parts.push(`attempt ${attempt}`);
                }
                const step = payload.step || 'unknown_step';
                const status = payload.status || 'unknown';
                const pathMode = payload.path_mode || 'n/a';
                parts.push(`${step}`);
                parts.push(`status=${status}`);
                parts.push(`path=${pathMode}`);
                if (payload.reason) {
                  parts.push(`reason=${payload.reason}`);
                }
                if (payload.candidate_count !== undefined && payload.candidate_count !== null) {
                  parts.push(`candidates=${payload.candidate_count}`);
                }
                if (payload.selected_candidate) {
                  parts.push(`selected=${payload.selected_candidate}`);
                }
                if (payload.tool_name) {
                  parts.push(`tool=${payload.tool_name}`);
                }
                return `<li><span class="mono">${esc(ts)}</span> ${esc(parts.join(' • '))}</li>`;
              }
              const incident = payload.incident_id ? ` • ${payload.incident_id}` : '';
              return `<li><span class="mono">${esc(ts)}</span> ${esc(row.event_type || 'event')}${esc(incident)}</li>`;
            }).join('')}
          </ul>
        `;
      }

      function renderTimeline(data) {
        const timeline = Array.isArray(data.timeline) ? data.timeline.slice(0, 30) : [];
        byId('timeline').innerHTML = timelineMarkup(timeline, 'No active recovery timeline.');
      }

      function historyIncidentDetailFor(data, incidentId) {
        if (!incidentId) {
          return null;
        }
        const views = data && data.history_incident_views && typeof data.history_incident_views === 'object'
          ? data.history_incident_views
          : {};
        return views[incidentId] || null;
      }

      function renderHistoryIncidentDashboard(data, incidentId) {
        if (!incidentId) {
          byId('history-incident').innerHTML = '<div class="small">Select a history incident to inspect details.</div>';
          return;
        }
        const incidentDetail = historyIncidentDetailFor(data, incidentId);
        if (!incidentDetail) {
          byId('history-incident').innerHTML = `<div class="small">No incident details found for ${esc(incidentId)}.</div>`;
          return;
        }
        const incidentView = incidentViewFor(data, incidentId);
        const timeline = Array.isArray(incidentDetail.timeline) ? incidentDetail.timeline.slice(0, 30) : [];
        byId('history-incident').innerHTML = `
          <div class="incident-grid">
            <div class="incident-panel">
              <h3>Agent State</h3>
              ${stateMarkup(incidentDetail.agent_state || {})}
            </div>
            <div class="incident-panel">
              <h3>WHY Diagnosis</h3>
              ${whyMarkup(incidentDetail.latest_why, 'No diagnosis for this incident.')}
            </div>
            <div class="incident-panel">
              <h3>HOW Proposals</h3>
              ${howMarkup(incidentDetail.latest_how, 'No HOW proposal for this incident.')}
            </div>
            <div class="incident-panel">
              <h3>RL Live</h3>
              ${incidentRlMarkup(incidentView, 'No RL data for this incident.')}
            </div>
            <div class="incident-panel">
              <h3>Dynamic Tool Catalog</h3>
              ${incidentCatalogMarkup(incidentView, 'No dynamic tools for this incident.')}
            </div>
            <div class="incident-panel">
              <h3>Recovery Timeline</h3>
              ${timelineMarkup(timeline, 'No timeline for this incident.')}
            </div>
          </div>
        `;
      }

      function renderRawTrace(traceData) {
        const trace = traceData ? traceData.trace : null;
        if (!trace) {
          byId('raw-trace').innerHTML = '<div class="small">No active trace data.</div>';
          return;
        }
        byId('raw-trace').innerHTML = `
          <details open>
            <summary>Active trace (${esc(trace.incident_id || 'unknown')})</summary>
            ${asJson(trace)}
          </details>
          <div class="small">available incidents: ${esc((traceData.available_incident_ids || []).join(', ') || 'none')}</div>
        `;
      }

      function renderHistoryRows(historyRows) {
        const rows = Array.isArray(historyRows) ? historyRows : [];
        if (!rows.length) {
          byId('history').innerHTML = '<div class="small">No completed recovery records yet.</div>';
          return;
        }
        byId('history').innerHTML = `
          <table>
            <thead>
              <tr>
                <th>incident_id</th>
                <th>failure_type</th>
                <th>attempts</th>
                <th>final_tool</th>
                <th>recovered_at</th>
                <th>incident</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((row) => {
                const recoveredAt = row.recovered_ts
                  ? new Date(row.recovered_ts * 1000).toLocaleString()
                  : 'n/a';
                const isSelected = selectedHistoryIncident === row.incident_id;
                return `
                  <tr>
                    <td class="mono">${esc(row.incident_id || 'unknown')}</td>
                    <td>${esc(row.failure_type || 'unknown')}</td>
                    <td>${esc(row.attempts || 0)}</td>
                    <td class="mono">${esc(row.final_tool_name || 'n/a')}</td>
                    <td>${esc(recoveredAt)}</td>
                    <td>
                      <button
                        type="button"
                        class="trace-button ${isSelected ? 'selected' : ''}"
                        data-history-incident="${esc(row.incident_id || '')}"
                      >
                        ${isSelected ? 'Viewing' : 'View Incident'}
                      </button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      }

      function renderHistoryTrace(traceData, incidentId) {
        if (!incidentId) {
          byId('history-trace').innerHTML = '<div class="small">Select a history row to inspect its LLM trace.</div>';
          return;
        }
        const trace = traceData ? traceData.trace : null;
        if (!trace) {
          byId('history-trace').innerHTML = `<div class="small">No trace found for ${esc(incidentId)}.</div>`;
          return;
        }
        byId('history-trace').innerHTML = `
          <details open>
            <summary>Trace for ${esc(incidentId)}</summary>
            ${asJson(trace)}
          </details>
        `;
      }

      async function fetchTrace(incidentId) {
        if (!incidentId) {
          return null;
        }
        const response = await fetch(`/agent/llm-trace?incident_id=${encodeURIComponent(incidentId)}`, {
          cache: 'no-store',
        });
        if (!response.ok) {
          return null;
        }
        return await response.json();
      }

      async function tick() {
        if (inFlight) {
          return;
        }
        inFlight = true;
        try {
          const dashboardResp = await fetch('/agent/dashboard', { cache: 'no-store' });
          if (!dashboardResp.ok) {
            throw new Error(`/agent/dashboard ${dashboardResp.status}`);
          }
          const dashboard = await dashboardResp.json();
          latestDashboard = dashboard;

          renderAgentState(dashboard);
          renderWhy(dashboard);
          renderHow(dashboard);
          renderIncidentRl('rl', dashboard.live_incident_view || null, '');
          renderIncidentCatalog('catalog', dashboard.live_incident_view || null, '');
          renderTimeline(dashboard);
          renderHistoryRows(dashboard.history || []);

          const activeTrace = await fetchTrace(dashboard.latest_trace_incident_id || null);
          renderRawTrace(activeTrace);

          const historyRows = Array.isArray(dashboard.history) ? dashboard.history : [];
          if (selectedHistoryIncident && !historyRows.some((row) => row.incident_id === selectedHistoryIncident)) {
            selectedHistoryIncident = null;
          }

          const historyTrace = await fetchTrace(selectedHistoryIncident);
          renderHistoryTrace(historyTrace, selectedHistoryIncident);
          renderHistoryIncidentDashboard(dashboard, selectedHistoryIncident);

          const activeIncident = dashboard.agent_state && dashboard.agent_state.active_incident;
          const activeLabel = activeIncident ? `active incident ${activeIncident.incident_id}` : 'no active incident';
          byId('meta').textContent = `Updated ${new Date().toLocaleTimeString()} • polling every 1s • ${activeLabel}`;
        } catch (error) {
          byId('meta').textContent = `Dashboard error: ${error}`;
        } finally {
          inFlight = false;
        }
      }

      byId('tab-live').addEventListener('click', () => setActiveTab('live'));
      byId('tab-history').addEventListener('click', () => setActiveTab('history'));

      document.addEventListener('click', (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) {
          return;
        }
        const button = target.closest('[data-history-incident]');
        if (!(button instanceof HTMLElement)) {
          return;
        }
        const incidentId = button.getAttribute('data-history-incident');
        if (!incidentId) {
          return;
        }
        selectedHistoryIncident = incidentId;
        if (activeTab !== 'history') {
          setActiveTab('history');
        }
        if (latestDashboard) {
          renderHistoryRows(latestDashboard.history || []);
          renderHistoryIncidentDashboard(latestDashboard, selectedHistoryIncident);
        }
      });

      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
