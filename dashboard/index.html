<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MI Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #171a21;
        --text: #e8ebf2;
        --muted: #9aa3b2;
        --ok: #52d273;
        --warn: #ffd166;
        --bad: #ff6b6b;
        --line: #2a2f3a;
        --tab: #1d2330;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
        color: var(--text);
        background: var(--bg);
      }
      header {
        position: sticky;
        top: 0;
        background: #11141b;
        border-bottom: 1px solid var(--line);
        padding: 12px 16px;
        z-index: 2;
      }
      header h1 { margin: 0; font-size: 18px; }
      header p { margin: 4px 0 0; color: var(--muted); }
      .tabs {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .tab {
        border: 1px solid var(--line);
        background: var(--tab);
        color: var(--muted);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .tab.active {
        color: var(--text);
        border-color: #3d6ad6;
      }
      .view {
        display: none;
        padding: 12px;
      }
      .view.active {
        display: grid;
      }
      #live-view {
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 12px;
      }
      #history-view {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        min-height: 120px;
      }
      h2 { margin: 0 0 8px; font-size: 14px; color: #dce3f2; }
      .pill {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 8px;
        margin-right: 6px;
        margin-bottom: 4px;
        color: var(--muted);
      }
      .ok { color: var(--ok); }
      .warn { color: var(--warn); }
      .bad { color: var(--bad); }
      table { width: 100%; border-collapse: collapse; }
      th, td {
        text-align: left;
        border-bottom: 1px solid var(--line);
        padding: 6px 4px;
        vertical-align: top;
      }
      th { color: var(--muted); font-weight: 600; }
      ul { margin: 0; padding-left: 18px; }
      li { margin: 4px 0; }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 320px;
        overflow: auto;
      }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .small { font-size: 12px; color: var(--muted); }
      details > summary { cursor: pointer; color: #d7def0; }
      .badge {
        font-size: 11px;
        border: 1px solid #3d6ad6;
        color: #8fb0ff;
        border-radius: 999px;
        padding: 1px 8px;
        margin-left: 6px;
      }
      .trace-button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        border-radius: 6px;
        cursor: pointer;
        padding: 4px 8px;
      }
      .trace-button.selected {
        border-color: #3d6ad6;
        color: #8fb0ff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>MI Dashboard</h1>
      <p id="meta" class="small">Loading…</p>
      <div class="tabs">
        <button id="tab-live" class="tab active" type="button">Live</button>
        <button id="tab-history" class="tab" type="button">History</button>
      </div>
    </header>

    <main id="live-view" class="view active">
      <section>
        <h2>Agent State</h2>
        <div id="agent-state"></div>
      </section>

      <section>
        <h2>WHY Diagnosis</h2>
        <div id="why"></div>
      </section>

      <section>
        <h2>HOW Proposals</h2>
        <div id="how"></div>
      </section>

      <section>
        <h2>RL Live</h2>
        <div id="rl"></div>
      </section>

      <section>
        <h2>Dynamic Tool Catalog</h2>
        <div id="catalog"></div>
      </section>

      <section>
        <h2>Recovery Timeline</h2>
        <div id="timeline"></div>
      </section>

      <section style="grid-column: 1 / -1;">
        <h2>Raw LLM Trace</h2>
        <div id="raw-trace"></div>
      </section>
    </main>

    <main id="history-view" class="view">
      <section>
        <h2>Recovery History</h2>
        <div id="history"></div>
      </section>
      <section>
        <h2>History Trace</h2>
        <div id="history-trace"></div>
      </section>
    </main>

    <script>
      const byId = (id) => document.getElementById(id);
      let activeTab = 'live';
      let selectedHistoryIncident = null;
      let latestDashboard = null;
      let inFlight = false;

      function esc(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;');
      }

      function asJson(value) {
        return `<pre class="mono">${esc(JSON.stringify(value, null, 2))}</pre>`;
      }

      function setActiveTab(tab) {
        activeTab = tab;
        byId('tab-live').classList.toggle('active', tab === 'live');
        byId('tab-history').classList.toggle('active', tab === 'history');
        byId('live-view').classList.toggle('active', tab === 'live');
        byId('history-view').classList.toggle('active', tab === 'history');
      }

      function renderAgentState(data) {
        const state = data.agent_state || {};
        const incident = state.active_incident;
        const lastMonitor = state.last_monitor || {};
        const cls = state.workflow_state === 'healthy'
          ? 'ok'
          : (state.workflow_state === 'incident_active' ? 'bad' : 'warn');
        byId('agent-state').innerHTML = `
          <div class="pill ${cls}">workflow: ${esc(state.workflow_state || 'unknown')}</div>
          <div class="pill">monitor: ${esc(lastMonitor.detail || 'n/a')}</div>
          <div class="small">incident: ${esc(incident ? incident.incident_id : 'none')}</div>
          <div class="small">attempts: ${esc(incident ? incident.attempts : 0)}</div>
          <div class="small">last_error: ${esc(incident ? (incident.last_error || 'none') : 'none')}</div>
        `;
      }

      function renderWhy(data) {
        const why = data.latest_why;
        if (!why) {
          byId('why').innerHTML = '<div class="small">No active diagnosis.</div>';
          return;
        }
        byId('why').innerHTML = `
          <div><b>failure_type:</b> <span class="mono">${esc(why.failure_type || 'unknown')}</span></div>
          <div class="small"><b>hypotheses</b></div>
          <ul>${(why.hypotheses || []).map((item) => `<li>${esc(item)}</li>`).join('')}</ul>
          <div class="small"><b>evidence</b></div>
          <ul>${(why.evidence || []).map((item) => `<li>${esc(item)}</li>`).join('')}</ul>
        `;
      }

      function renderHow(data) {
        const how = data.latest_how;
        if (!how) {
          byId('how').innerHTML = '<div class="small">No active HOW proposal.</div>';
          return;
        }
        const primary = how.primary || {};
        const alternatives = Array.isArray(how.alternatives) ? how.alternatives : [];
        byId('how').innerHTML = `
          <div>
            <b>Primary</b>
            <span class="badge">EXECUTED</span>
            <div class="small mono">${esc(primary.name || 'unnamed')} • ${esc(primary.operation || 'n/a')}</div>
            <div>${esc(primary.rationale || '')}</div>
          </div>
          <div class="small" style="margin-top:8px;"><b>Alternatives (observability only)</b></div>
          <ol>
            ${alternatives.map((item) => `
              <li>
                <div class="mono">${esc(item.name || 'unnamed')} • ${esc(item.operation || 'n/a')}</div>
                <div>${esc(item.rationale || '')}</div>
              </li>
            `).join('')}
          </ol>
        `;
      }

      function renderRl(data) {
        const summary = data.rl_summary || {};
        const rows = Array.isArray(summary.actions) ? summary.actions : [];
        byId('rl').innerHTML = `
          <div class="small">total_attempts: ${esc(summary.total_attempts || 0)} • reward_total: ${esc(summary.reward_total || 0)}</div>
          <table>
            <thead>
              <tr><th>action</th><th>attempts</th><th>reward_total</th><th>avg_reward</th></tr>
            </thead>
            <tbody>
              ${rows.map((row) => `
                <tr>
                  <td class="mono">${esc(row.action)}</td>
                  <td>${esc(row.attempts)}</td>
                  <td>${esc(row.reward_total)}</td>
                  <td>${esc(Number(row.avg_reward || 0).toFixed(3))}</td>
                </tr>
              `).join('') || '<tr><td colspan="4" class="small">No RL stats yet.</td></tr>'}
            </tbody>
          </table>
        `;
      }

      function renderCatalog(data) {
        const catalog = data.tool_catalog || {};
        const items = Object.entries(catalog);
        if (!items.length) {
          byId('catalog').innerHTML = '<div class="small">No persisted dynamic tools yet.</div>';
          return;
        }
        byId('catalog').innerHTML = `
          <ul>
            ${items.map(([name, value]) => `<li><span class="mono">${esc(name)}</span> — ${esc((value && value.operation) || 'n/a')}</li>`).join('')}
          </ul>
        `;
      }

      function renderTimeline(data) {
        const timeline = Array.isArray(data.timeline) ? data.timeline.slice(0, 30) : [];
        if (!timeline.length) {
          byId('timeline').innerHTML = '<div class="small">No active recovery timeline.</div>';
          return;
        }
        byId('timeline').innerHTML = `
          <ul>
            ${timeline.map((row) => {
              const ts = new Date((row.ts || 0) * 1000).toLocaleTimeString();
              const incident = row.payload && row.payload.incident_id ? ` • ${row.payload.incident_id}` : '';
              return `<li><span class="mono">${esc(ts)}</span> ${esc(row.event_type || 'event')}${esc(incident)}</li>`;
            }).join('')}
          </ul>
        `;
      }

      function renderRawTrace(traceData) {
        const trace = traceData ? traceData.trace : null;
        if (!trace) {
          byId('raw-trace').innerHTML = '<div class="small">No active trace data.</div>';
          return;
        }
        byId('raw-trace').innerHTML = `
          <details open>
            <summary>Active trace (${esc(trace.incident_id || 'unknown')})</summary>
            ${asJson(trace)}
          </details>
          <div class="small">available incidents: ${esc((traceData.available_incident_ids || []).join(', ') || 'none')}</div>
        `;
      }

      function renderHistoryRows(historyRows) {
        const rows = Array.isArray(historyRows) ? historyRows : [];
        if (!rows.length) {
          byId('history').innerHTML = '<div class="small">No completed recovery records yet.</div>';
          return;
        }
        byId('history').innerHTML = `
          <table>
            <thead>
              <tr>
                <th>incident_id</th>
                <th>failure_type</th>
                <th>attempts</th>
                <th>final_tool</th>
                <th>recovered_at</th>
                <th>trace</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((row) => {
                const recoveredAt = row.recovered_ts
                  ? new Date(row.recovered_ts * 1000).toLocaleString()
                  : 'n/a';
                const isSelected = selectedHistoryIncident === row.incident_id;
                return `
                  <tr>
                    <td class="mono">${esc(row.incident_id || 'unknown')}</td>
                    <td>${esc(row.failure_type || 'unknown')}</td>
                    <td>${esc(row.attempts || 0)}</td>
                    <td class="mono">${esc(row.final_tool_name || 'n/a')}</td>
                    <td>${esc(recoveredAt)}</td>
                    <td>
                      <button
                        type="button"
                        class="trace-button ${isSelected ? 'selected' : ''}"
                        data-history-incident="${esc(row.incident_id || '')}"
                      >
                        ${isSelected ? 'Viewing' : 'View Trace'}
                      </button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      }

      function renderHistoryTrace(traceData, incidentId) {
        if (!incidentId) {
          byId('history-trace').innerHTML = '<div class="small">Select a history row to inspect its LLM trace.</div>';
          return;
        }
        const trace = traceData ? traceData.trace : null;
        if (!trace) {
          byId('history-trace').innerHTML = `<div class="small">No trace found for ${esc(incidentId)}.</div>`;
          return;
        }
        byId('history-trace').innerHTML = `
          <details open>
            <summary>Trace for ${esc(incidentId)}</summary>
            ${asJson(trace)}
          </details>
        `;
      }

      async function fetchTrace(incidentId) {
        if (!incidentId) {
          return null;
        }
        const response = await fetch(`/agent/llm-trace?incident_id=${encodeURIComponent(incidentId)}`, {
          cache: 'no-store',
        });
        if (!response.ok) {
          return null;
        }
        return await response.json();
      }

      async function tick() {
        if (inFlight) {
          return;
        }
        inFlight = true;
        try {
          const dashboardResp = await fetch('/agent/dashboard', { cache: 'no-store' });
          if (!dashboardResp.ok) {
            throw new Error(`/agent/dashboard ${dashboardResp.status}`);
          }
          const dashboard = await dashboardResp.json();
          latestDashboard = dashboard;

          renderAgentState(dashboard);
          renderWhy(dashboard);
          renderHow(dashboard);
          renderRl(dashboard);
          renderCatalog(dashboard);
          renderTimeline(dashboard);
          renderHistoryRows(dashboard.history || []);

          const activeTrace = await fetchTrace(dashboard.latest_trace_incident_id || null);
          renderRawTrace(activeTrace);

          const historyRows = Array.isArray(dashboard.history) ? dashboard.history : [];
          if (selectedHistoryIncident && !historyRows.some((row) => row.incident_id === selectedHistoryIncident)) {
            selectedHistoryIncident = null;
          }

          const historyTrace = await fetchTrace(selectedHistoryIncident);
          renderHistoryTrace(historyTrace, selectedHistoryIncident);

          const activeIncident = dashboard.agent_state && dashboard.agent_state.active_incident;
          const activeLabel = activeIncident ? `active incident ${activeIncident.incident_id}` : 'no active incident';
          byId('meta').textContent = `Updated ${new Date().toLocaleTimeString()} • polling every 1s • ${activeLabel}`;
        } catch (error) {
          byId('meta').textContent = `Dashboard error: ${error}`;
        } finally {
          inFlight = false;
        }
      }

      byId('tab-live').addEventListener('click', () => setActiveTab('live'));
      byId('tab-history').addEventListener('click', () => setActiveTab('history'));

      document.addEventListener('click', (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) {
          return;
        }
        const button = target.closest('[data-history-incident]');
        if (!(button instanceof HTMLElement)) {
          return;
        }
        const incidentId = button.getAttribute('data-history-incident');
        if (!incidentId) {
          return;
        }
        selectedHistoryIncident = incidentId;
        if (activeTab !== 'history') {
          setActiveTab('history');
        }
        if (latestDashboard) {
          renderHistoryRows(latestDashboard.history || []);
        }
      });

      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
