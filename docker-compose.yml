services:
  target-app:
    build:
      context: .
      dockerfile: target/app/Dockerfile
    container_name: mi-target-app
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    environment:
      TARGET_HEARTBEAT_INTERVAL_SECONDS: ${TARGET_HEARTBEAT_INTERVAL_SECONDS:-3}
      # 1 registers POST /ops/fault/{fault} and POST /ops/reset (harness campaign only).
      TARGET_TEST_HOOKS: ${TARGET_TEST_HOOKS:-0}
    volumes:
      - ./target/app:/target/app
      - backups_data:/target/backups:ro

  backup-job:
    # python image: the job validates each copy with scripts/find_known_good_backup.py.
    image: python:3.12-slim
    container_name: mi-backup-job
    depends_on:
      - target-app
    command: ["/bin/sh", "/backup/backup.sh"]
    volumes:
      - ./target/app:/target/app:ro
      - backups_data:/target/backups
      - ./target/backup:/backup:ro
      - ./scripts:/scripts:ro

  traffic:
    # Simulated users: one widget write every TRAFFIC_INTERVAL_SECONDS, so a restore
    # discards real rows and MI's data-loss reward has something to measure.
    image: python:3.12-slim
    container_name: mi-traffic
    depends_on:
      - target-app
    command: ["python", "-u", "/traffic/traffic.py"]
    environment:
      TRAFFIC_TARGET_URL: http://target-app:8080
      TRAFFIC_INTERVAL_SECONDS: ${TRAFFIC_INTERVAL_SECONDS:-2}
    volumes:
      - ./target/traffic:/traffic:ro

  mi-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mi-agent
    depends_on:
      - target-app
      - backup-job
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MI_TARGET_SERVICE_URL: http://target-app:8080
      MI_MONITOR_HEALTH_PATH: /health/deep
      MI_LOGS_ENDPOINT_PATH: /ops/logs
      MI_DB_STATUS_ENDPOINT_PATH: /ops/db/status
      MI_BACKUPS_ENDPOINT_PATH: /ops/backups
      MI_MONITOR_INTERVAL_SECONDS: "1"
      MI_REQUEST_TIMEOUT_SECONDS: "5"
      MI_APP_ROOT: /target/app
      MI_SANDBOX_ROOT: /target
      MI_DB_FILE: /target/app/data/app.db
      MI_APP_LOG: /target/app/app.log
      MI_SCHEMA_FILE: /target/app/schema.sql
      MI_STATE_DIR: /state
      MI_EVENT_LOG_PATH: /state/events.jsonl
      MI_POLICY_STORE_PATH: /state/policy_store.json
      MI_TOOL_CATALOG_PATH: /state/tool_catalog.json
      MI_LLM_MODEL: ${MI_LLM_MODEL:-gpt-5.3-codex}
      MI_LLM_ENDPOINT: ${MI_LLM_ENDPOINT:-https://api.openai.com/v1/responses}
      MI_LLM_TIMEOUT_SECONDS: ${MI_LLM_TIMEOUT_SECONDS:-20}
      MI_LLM_AUTH_MODE: ${MI_LLM_AUTH_MODE:-bearer}
      MI_LLM_API_KEY_HEADER: ${MI_LLM_API_KEY_HEADER:-api-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      MI_JEV_ENABLED: ${MI_JEV_ENABLED:-true}
      JEV_API_KEY: ${JEV_API_KEY:?JEV_API_KEY is required}
      MI_JEV_MODEL: ${MI_JEV_MODEL:-jev-latest}
      MI_JEV_BASE_URL: ${MI_JEV_BASE_URL:-http://host.docker.internal:8017}
      MI_JEV_TIMEOUT_SECONDS: ${MI_JEV_TIMEOUT_SECONDS:-8}
      MI_JEV_USABLE_THRESHOLD: ${MI_JEV_USABLE_THRESHOLD:-0.65}
      MI_RAG_ENABLED: ${MI_RAG_ENABLED:-true}
      PINECONE_API_KEY: ${PINECONE_API_KEY:?PINECONE_API_KEY is required}
      PINECONE_INDEX_HOST: ${PINECONE_INDEX_HOST:?PINECONE_INDEX_HOST is required}
      PINECONE_NAMESPACE: ${PINECONE_NAMESPACE:-sqlite-docs}
      MI_CLASSMEM_ENABLED: ${MI_CLASSMEM_ENABLED:-true}
      MI_CLASSMEM_DEDUPE_ENABLED: ${MI_CLASSMEM_DEDUPE_ENABLED:-true}
      MI_CLASSMEM_FASTPATH_ENABLED: ${MI_CLASSMEM_FASTPATH_ENABLED:-true}
      MI_CLASSMEM_STORE_PATH: ${MI_CLASSMEM_STORE_PATH:-/state/class_store.json}
      MI_CLASSMEM_JOIN_THRESHOLD: ${MI_CLASSMEM_JOIN_THRESHOLD:-0.82}
      MI_CLASSMEM_MARGIN_DELTA: ${MI_CLASSMEM_MARGIN_DELTA:-0.08}
      MI_CLASSMEM_TAU_CONF: ${MI_CLASSMEM_TAU_CONF:-0.80}
      MI_CLASSMEM_N_MIN: ${MI_CLASSMEM_N_MIN:-3}
      MI_CLASSMEM_COOLDOWN_SECONDS: ${MI_CLASSMEM_COOLDOWN_SECONDS:-30}
      MI_CLASSMEM_EMBEDDING_DIM: ${MI_CLASSMEM_EMBEDDING_DIM:-96}
    volumes:
      # No backups volume: MI lists and restores backups through the target's API.
      - ./target/app:/target/app
      - ./state:/state

volumes:
  backups_data:
